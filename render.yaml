services:
  # ── SmartBill Backend Web Service (Node.js / Express / MongoDB) ──
  - type: web
    name: smartbill-backend
    env: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPERADMIN_EMAIL
        value: admin@smartbill.com
      - key: SUPERADMIN_PASSWORD
        sync: false # Set your strong super admin password
      - key: ALLOWED_ORIGINS
        value: "*"

  # ── SmartBill CRM / POS Billing Frontend ──
  - type: web
    name: smartbill-crm
    env: static
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartbill-backend
          property: host
        value: https://${smartbill-backend.host}/api

  # ── SmartBill SuperAdmin Panel ──
  - type: web
    name: smartbill-admin
    env: static
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /admin/index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartbill-backend
          property: host
        value: https://${smartbill-backend.host}/api

  # ── SmartBill Landing Page ──
  - type: web
    name: smartbill-landing
    env: static
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartbill-backend
          property: host
        value: https://${smartbill-backend.host}/api
